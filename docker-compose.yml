x-frontend-environment: &frontend-environment
  FRONTEND_ORIGIN: "${COMPOSE_FRONTEND_ORIGIN:-http://localhost:5174}"

services:
  user-service:
    build: ./services/user-service
    env_file:
      - ./services/user-service/.env
    environment:
      <<: *frontend-environment
    ports:
      - "5001:5000"

  event-service:
    build: ./services/event-service
    # Preserve service-specific database settings. Require the shared root
    # token explicitly below: never silently inject an empty token that
    # disables an internal endpoint's guard.
    env_file:
      - path: ./.env
        required: false
      - ./services/event-service/.env
    environment:
      <<: *frontend-environment
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in the root .env}"
    ports:
      - "5003:5000"

  coordinator-assignment-service:
    build: ./services/coordinator-assignment-service
    env_file:
      - ./services/coordinator-assignment-service/.env
    environment:
      <<: *frontend-environment
      EVENT_SERVICE_URL: "http://event-service:5000"
      USER_SERVICE_URL: "http://user-service:5000"
    ports:
      - "5004:5000"

  registration-service:
    build: ./services/registration-service
    env_file:
      - ./services/registration-service/.env
    environment:
      <<: *frontend-environment
    ports:
      - "5005:5000"

  attendee-registration-service:
    build: ./services/attendee-registration-service
    environment:
      <<: *frontend-environment
      EVENT_SERVICE_URL: "http://event-service:5000"
      REGISTRATION_SERVICE_URL: "http://registration-service:5000"
      USER_SERVICE_URL: "http://user-service:5000"
    depends_on:
      - event-service
      - registration-service
      - user-service
    ports:
      - "5009:5000"

  venue-availability-service:
    build: ./services/venue-availability-service
    env_file:
      - ./.env
      - ./services/venue-availability-service/.env
    environment:
      <<: *frontend-environment
      CALENDAR_DEV_MODE: "${CALENDAR_DEV_MODE:-false}"
      VENUE_CLOSURE_DEV_MODE: "${VENUE_CLOSURE_DEV_MODE:-false}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in the root .env}"
      VENUE_BOOKING_LEGACY_SCHEMA: "${VENUE_BOOKING_LEGACY_SCHEMA:-false}"
    ports:
      - "127.0.0.1:5008:5000"

  equipment-service:
    build: ./services/equipment-service
    env_file:
      - ./services/equipment-service/.env
    environment:
      <<: *frontend-environment
    ports:
      - "5002:5000"

  equipment-request-service:
    build: ./services/equipment-request-service
    env_file:
      - ./services/equipment-request-service/.env
    environment:
      <<: *frontend-environment
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in the root .env}"
    ports:
      - "5011:5000"

  equipment-reservation-service:
    build: ./services/equipment-reservation-service
    env_file:
      - ./services/equipment-reservation-service/.env
    environment:
      <<: *frontend-environment
      EQUIPMENT_REQUEST_SERVICE_URL: http://equipment-request-service:5000
      EVENT_SERVICE_URL: http://event-service:5000
      EQUIPMENT_SERVICE_URL: http://equipment-service:5000
      SAFETY_CHECK_RECORD_SERVICE_URL: http://safety-check-record-service:5000
    ports:
      - "5010:5000"
    depends_on:
      - equipment-request-service
      - event-service
      - equipment-service
      - safety-check-record-service

  venue-service:
    build: ./services/venue-service
    env_file:
      - ./services/venue-service/.env
    environment:
      <<: *frontend-environment
    ports:
      - "5006:5000"

  venue-booking-service:
    build: ./services/venue-booking-service
    env_file:
      - ./services/venue-booking-service/.env
    environment:
      <<: *frontend-environment
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in the root .env}"
      VENUE_CLOSURE_DEV_MODE: "${VENUE_CLOSURE_DEV_MODE:-false}"
      SAFETY_CHECK_RECORD_SERVICE_URL: http://safety-check-record-service:5000
      # SCRUM-28 Part B: a booking change on a Confirmed event withdraws its safety approval.
      SAFETY_CHECK_SERVICE_URL: http://safety-check-service:5000
    depends_on:
      - event-service
      - venue-service
      - venue-availability-service
      - safety-check-record-service
      - safety-check-service
    ports:
      - "5007:5000"

  rabbitmq:
    image: rabbitmq:4-management
    # Stable node/data-directory identity across replacement, not only restart.
    # Existing volumes need an explicit node-identity transition (see Notification README).
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-notification}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-local-development-only}"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - notification-rabbitmq-data:/var/lib/rabbitmq

  notification-service:
    build: ./services/notification-service
    # Compose uses root settings; no notification-specific .env is needed.
    environment:
      <<: *frontend-environment
      DATABASE_URL: "${NOTIFICATION_DATABASE_URL:-${DATABASE_URL}}"
      NOTIFICATION_DEV_MODE: "${NOTIFICATION_DEV_MODE:-false}"
    ports:
      - "127.0.0.1:5015:5000"

  notification-consumer:
    build: ./services/notification-service
    command: ["uv", "run", "--no-dev", "python", "-m", "app.consumer"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "${NOTIFICATION_DATABASE_URL:-${DATABASE_URL}}"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-notification}:${RABBITMQ_PASSWORD:-local-development-only}@rabbitmq:5672/%2F"
    depends_on:
      - rabbitmq

  venue-notification-dispatcher:
    build: ./services/venue-booking-service
    command: ["uv", "run", "--no-dev", "python", "-m", "app.dispatcher"]
    restart: unless-stopped
    # This worker calls HTTP APIs; it does not need database credentials.
    environment:
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in the root .env}"
      VENUE_AVAILABILITY_SERVICE_URL: "http://venue-availability-service:5000"
      EVENT_SERVICE_URL: "http://event-service:5000"
      VENUE_SERVICE_URL: "http://venue-service:5000"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-notification}:${RABBITMQ_PASSWORD:-local-development-only}@rabbitmq:5672/%2F"
    depends_on:
      - rabbitmq
      - venue-availability-service
      - event-service
      - venue-service

  safety-check-record-service:
    build: ./services/safety-check-record-service
    env_file:
      - ./services/safety-check-record-service/.env
    environment:
      <<: *frontend-environment
    ports:
      - "5013:5000"

  safety-check-service:
    build: ./services/safety-check-service
    environment:
      <<: *frontend-environment
      EVENT_SERVICE_URL: "http://event-service:5000"
      VENUE_AVAILABILITY_SERVICE_URL: "http://venue-availability-service:5000"
      EQUIPMENT_REQUEST_SERVICE_URL: "http://equipment-request-service:5000"
      SAFETY_CHECK_RECORD_SERVICE_URL: "http://safety-check-record-service:5000"
      USER_SERVICE_URL: "http://user-service:5000"
      VENUE_SERVICE_URL: "http://venue-service:5000"
      EQUIPMENT_SERVICE_URL: "http://equipment-service:5000"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in the root .env}"
    depends_on:
      - event-service
      - venue-availability-service
      - equipment-request-service
      - safety-check-record-service
      - user-service
      - venue-service
      - equipment-service
    ports:
      - "5012:5000"

  event-notification-dispatcher:
    build: ./services/event-workflow-service
    command: ["uv", "run", "--no-dev", "python", "-m", "app.dispatcher"]
    restart: unless-stopped
    environment:
      EVENT_SERVICE_URL: "http://event-service:5000"
      USER_SERVICE_URL: "http://user-service:5000"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN}"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-notification}:${RABBITMQ_PASSWORD:-local-development-only}@rabbitmq:5672/%2F"
    depends_on:
      - event-service
      - user-service
      - rabbitmq

  event-workflow-service:
    build: ./services/event-workflow-service
    environment:
      <<: *frontend-environment
      EVENT_SERVICE_URL: "http://event-service:5000"
      VENUE_AVAILABILITY_SERVICE_URL: "http://venue-availability-service:5000"
      EQUIPMENT_REQUEST_SERVICE_URL: "http://equipment-request-service:5000"
      EQUIPMENT_SERVICE_URL: "http://equipment-service:5000"
      USER_SERVICE_URL: "http://user-service:5000"
      VENUE_SERVICE_URL: "http://venue-service:5000"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in the root .env}"
    depends_on:
      - event-service
      - venue-availability-service
      - equipment-request-service
      - equipment-service
      - user-service
      - venue-service
    ports:
      - "5014:5000"
volumes:
  notification-rabbitmq-data:
