services:
  user-service:
    build: ./services/user-service
    env_file:
      - ./services/user-service/.env
    ports:
      - "5001:5000"

  event-service:
    build: ./services/event-service
    env_file:
      - ./services/event-service/.env
    ports:
      - "5003:5000"

  coordinator-assignment-service:
    build: ./services/coordinator-assignment-service
    env_file:
      - ./services/coordinator-assignment-service/.env
    ports:
      - "5004:5000"

  registration-service:
    build: ./services/registration-service
    env_file:
      - ./services/registration-service/.env
    ports:
      - "5005:5000"

  attendee-registration-service:
    build: ./services/attendee-registration-service
    environment:
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:5174}"
      EVENT_SERVICE_URL: "http://event-service:5000"
      REGISTRATION_SERVICE_URL: "http://registration-service:5000"
    depends_on:
      - event-service
      - registration-service
    ports:
      - "5009:5000"

  venue-availability-service:
    build: ./services/venue-availability-service
    env_file:
      - ./.env
      - ./services/venue-availability-service/.env
    environment:
      CALENDAR_DEV_MODE: "${CALENDAR_DEV_MODE:-false}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:5174}"
    ports:
      - "127.0.0.1:5008:5000"

  equipment-service:
    build: ./services/equipment-service
    env_file:
      - ./services/equipment-service/.env
    ports:
      - "5002:5000"

  venue-service:
    build: ./services/venue-service
    env_file:
      - ./services/venue-service/.env
    ports:
      - "5006:5000"

  venue-booking-service:
    build: ./services/venue-booking-service
    env_file:
      - ./services/venue-booking-service/.env
    ports:
      - "5007:5000"
