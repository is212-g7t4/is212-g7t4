name: SCRUM-173 isolated integration

# Dedicated opt-in job. The normal CI unit matrix remains hermetic/secret-free.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-notification-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Pull disposable infrastructure images
        run: |
          docker pull postgres:17
          docker pull rabbitmq:4-management
      - name: Run actual HTTP, PostgreSQL and RabbitMQ verification through pytest
        run: python3 scripts/verify_scrum173.py --integration-only --evidence reports/scrum173-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrum173-isolated-integration
          path: reports/scrum173-integration/
          retention-days: 14
          if-no-files-found: error
