name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide which parts of the repo changed. Done inside a job (not with
  # workflow-level `paths:`) so the required `ci-passed` check always reports.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user-service:
              - 'services/user-service/**'
              - '.github/workflows/ci.yml'
            event-service:
              - 'services/event-service/**'
              - '.github/workflows/ci.yml'
            coordinator-assignment-service:
              - 'services/coordinator-assignment-service/**'
              - '.github/workflows/ci.yml'
            registration-service:
              - 'services/registration-service/**'
              - '.github/workflows/ci.yml'
            venue-service:
              - 'services/venue-service/**'
              - '.github/workflows/ci.yml'
            venue-booking-service:
              - 'services/venue-booking-service/**'
              - '.github/workflows/ci.yml'
            venue-availability-service:
              - 'services/venue-availability-service/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'services/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - event-service
          - coordinator-assignment-service
          - registration-service
          - venue-service
          - venue-booking-service
          - venue-availability-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Check whether this service changed
        id: gate
        env:
          RUN: ${{ contains(fromJSON(needs.changes.outputs.changes), matrix.service) }}
        run: echo "run=$RUN" >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: uv sync --frozen
      - name: Run tests
        if: steps.gate.outputs.run == 'true'
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Audit dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          uv export --frozen --no-hashes --no-emit-project > requirements.txt
          uvx pip-audit -r requirements.txt --no-deps --disable-pip

  frontend:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'frontend')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/event-management-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/event-management-ui/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'frontend')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/event-management-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/event-management-ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Backends are mocked in the tests, so no services or secrets are needed.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/event-management-ui/playwright-report/
          retention-days: 7

  docker-build:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'docker')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docker-compose.yml's env_file entries require these to exist.
      - name: Create .env files from examples
        run: |
          cp .env.example .env
          for f in services/*/.env.example; do
            case "$f" in services/_template-*) continue ;; esac
            cp "$f" "${f%.example}"
          done
      - run: docker compose build

  # Scans the full git history for committed secrets. Runs on every PR/push
  # (not path-filtered). Known false positives live in .github/.gitleaksignore.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan for secrets
        run: gitleaks detect --redact -v --gitleaks-ignore-path .github/.gitleaksignore

  # Single required status check for branch protection.
  ci-passed:
    if: always()
    needs: [changes, backend, frontend, e2e, docker-build, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qE 'failure|cancelled'; then
            exit 1
          fi
