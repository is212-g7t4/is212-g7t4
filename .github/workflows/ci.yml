name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *" # 02:00 Singapore time, nightly full run on main
  workflow_dispatch: # "Run workflow" button for a manual full run

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede outdated PR runs, but let every main run finish, so two quick
  # merges cannot cancel the first main run and report it as a failure.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decide which parts of the repo changed. Done inside a job (not with
  # workflow-level `paths:`) so the required `ci-passed` check always reports.
  # Backend unit tests are deliberately NOT gated on this: every run runs every
  # test, so a change can never skip the tests that guard earlier work.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user-service:
              - 'services/user-service/**'
              - '.github/workflows/ci.yml'
            event-service:
              - 'services/event-service/**'
              - '.github/workflows/ci.yml'
            coordinator-assignment-service:
              - 'services/coordinator-assignment-service/**'
              - '.github/workflows/ci.yml'
            registration-service:
              - 'services/registration-service/**'
              - '.github/workflows/ci.yml'
            equipment-service:
              - 'services/equipment-service/**'
              - '.github/workflows/ci.yml'
            equipment-request-service:
              - 'services/equipment-request-service/**'
              - '.github/workflows/ci.yml'
            equipment-reservation-service:
              - 'services/equipment-reservation-service/**'
              - '.github/workflows/ci.yml'
            venue-service:
              - 'services/venue-service/**'
              - '.github/workflows/ci.yml'
            venue-booking-service:
              - 'services/venue-booking-service/**'
              - '.github/workflows/ci.yml'
            venue-availability-service:
              - 'services/venue-availability-service/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'services/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  # Lists every service folder so the test matrix never has to be maintained by
  # hand. A forgotten entry used to mean a service's tests silently never ran.
  discover-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
      integration: ${{ steps.list.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          # Any folder under services/ with a pyproject.toml is a service, so a
          # new service is tested from its first PR without editing this file.
          services=$(find services -mindepth 2 -maxdepth 2 -name pyproject.toml | cut -d/ -f2 | sort | jq -Rnc '[inputs]')
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Testing: $services"
          # Likewise, a service joins the integration matrix once it has a
          # tests/integration/ folder.
          integration=$(find services -mindepth 3 -maxdepth 3 -type d -path 'services/*/tests/integration' | cut -d/ -f2 | sort | jq -Rnc '[inputs]')
          echo "integration=$integration" >> "$GITHUB_OUTPUT"
          echo "Integration: $integration"
          # A broken `find` must never turn into "no tests ran, all green".
          if [ "$services" = "[]" ]; then
            echo "::error::No services discovered under services/*/pyproject.toml"
            exit 1
          fi
          if [ "$integration" = "[]" ]; then
            echo "::error::No services discovered under services/*/tests/integration"
            exit 1
          fi

  unit-tests:
    name: unit-tests (${{ matrix.service }})
    needs: discover-services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover-services.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      # No python-version here: `uv sync` reads each service's .python-version.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - name: Install dependencies
        run: uv sync --locked # fails if uv.lock is out of date with pyproject.toml
      # Every pytest and coverage setting lives in the service's pyproject.toml,
      # so this differs from a local run only in where it writes its reports.
      - name: Run unit tests
        run: uv run pytest --junitxml=reports/junit.xml --cov-report=xml:reports/coverage.xml
      - name: Add coverage to the run summary
        if: always()
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          echo "### $SERVICE" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/reports/
          retention-days: 14
          if-no-files-found: ignore

  # Each service's tests/integration/ against real infrastructure. Database
  # tests start their own throwaway postgres:17.6 container (testcontainers or
  # `docker run`) loaded with database/supabase/migrations, so no secrets are
  # needed and the shared Supabase project is never touched. Composites stub
  # their downstream services over HTTP with respx.
  integration-tests:
    name: integration-tests (${{ matrix.service }})
    needs: discover-services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover-services.outputs.integration) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      # There is no .env in CI, but some fixtures assert dotenv is off so a
      # stray .env can never point them at the shared database.
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      # Some fixtures run with --pull=never against a digest-pinned image.
      - name: Pull test database images
        run: |
          docker pull -q postgres:17.6
          grep -rhoE 'postgres@sha256:[0-9a-f]{64}' tests/integration | sort -u | xargs -r -n1 docker pull -q
      # -m integration replaces pyproject's default "not integration" filter.
      # --no-cov: the coverage floor is a unit-test measure.
      - name: Run integration tests
        env:
          TMPDIR: ${{ runner.temp }} # equipment-request's fixture requires it
        run: uv run pytest -m integration --no-cov --junitxml=reports/integration-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/reports/
          retention-days: 14
          if-no-files-found: ignore

  # Split out of the test job so that a vulnerable dependency reports as an
  # audit failure rather than as a "test" failure.
  dependency-audit:
    name: dependency-audit (${{ matrix.service }})
    needs: discover-services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover-services.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Audit locked dependencies
        run: |
          uv export --locked --no-hashes --no-emit-project > requirements.txt
          uvx pip-audit -r requirements.txt --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/event-management-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/event-management-ui/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  # J1, J3, J5a/b and J7 on the isolated stack: throwaway Postgres, local
  # Supabase Auth, RabbitMQ, every service and Vite, all started by the runner.
  # No secrets and no shared Supabase. One retry absorbs a service cold-start blip.
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/event-management-ui/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: frontend/event-management-ui
      - run: npx playwright install --with-deps chromium
      - name: Run journeys
        run: npm run test:journeys:isolated -- --grep "J1|J3|J5a|J5b|J7" --retries=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-reports
          path: |
            e2e/journeys/report/
            e2e/journeys/test-results/
          retention-days: 14
          if-no-files-found: ignore

  docker-build:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'docker')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docker-compose.yml's env_file entries require these to exist.
      - name: Create .env files from examples
        run: |
          cp .env.example .env
          for f in services/*/.env.example; do
            cp "$f" "${f%.example}"
          done
      - run: docker compose build

  # Scans the full git history for committed secrets. Runs on every PR/push
  # (not path-filtered). Known false positives live in .github/.gitleaksignore.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan for secrets
        run: gitleaks detect --redact -v --gitleaks-ignore-path .github/.gitleaksignore

  # Single required status check for branch protection.
  ci-passed:
    if: always()
    needs:
      [
        changes,
        discover-services,
        unit-tests,
        integration-tests,
        dependency-audit,
        frontend,
        journeys,
        docker-build,
        gitleaks,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qE 'failure|cancelled'; then
            exit 1
          fi
      # These must actually have run. A skipped job reports neither failure
      # nor cancellation, so without this a matrix that produced no jobs would
      # count as a pass.
      - name: Fail unless the backend jobs succeeded
        env:
          RESULTS: >-
            unit-tests=${{ needs.unit-tests.result }}
            integration-tests=${{ needs.integration-tests.result }}
            dependency-audit=${{ needs.dependency-audit.result }}
            journeys=${{ needs.journeys.result }}
        run: |
          status=0
          for entry in $RESULTS; do
            if [ "${entry#*=}" != "success" ]; then
              echo "::error::${entry%%=*} did not succeed (result: ${entry#*=})"
              status=1
            fi
          done
          exit $status
