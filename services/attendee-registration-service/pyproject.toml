[project]
name = "attendee-registration-service"
version = "0.1.0"
description = "Registers attendees after validating event availability and capacity"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not integration",
    "--cov",
    "--cov-report=term-missing",
    "--disable-socket",
]
markers = [
    "integration: needs a real external system (throwaway Postgres in Docker); deselected by default, run by CI's integration-tests job",
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 99
show_missing = true
