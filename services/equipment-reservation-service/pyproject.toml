[project]
name = "equipment-reservation-service"
version = "0.1.0"
description = "Equipment availability checking and review validation (composite)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "pika>=1.3.2",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not integration' --cov=app --cov-branch --cov-report=term-missing --cov-report=xml"
markers = ["integration: needs a real external system (throwaway Postgres in Docker); deselected by default, run by CI's integration-tests job"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 100
