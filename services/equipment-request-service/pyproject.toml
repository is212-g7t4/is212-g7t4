[project]
name = "equipment-request-service"
version = "0.1.0"
description = "Equipment request review service"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "psycopg2-binary>=2.9",
    "pyjwt[crypto]>=2.10",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not integration' --cov=app --cov-branch --cov-report=term-missing --cov-report=xml"
markers = ["integration: needs a real external system (throwaway Postgres in Docker); deselected by default, run by CI's integration-tests job"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
# Strict whole-owner line+branch gate; review status is validated at the routes
# and assigned by UPDATE RETURNING before notification recording.
fail_under = 100
