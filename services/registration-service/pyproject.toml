[project]
name = "registration-service"
version = "0.1.0"
description = "Attendee registration records (read-only for now; no registration/withdrawal logic)"
requires-python = ">=3.12"
dependencies = ["flask>=3.1.3", "psycopg2-binary>=2.9", "python-dotenv>=1.0.1"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Every setting lives here so `uv run pytest` behaves identically on a laptop
# and in CI; CI only adds report file paths.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not integration",
    "--cov",
    "--cov-report=term-missing",
    "--disable-socket",
]
markers = [
    "integration: needs a real external system (throwaway Postgres in Docker); deselected by default, run by CI's integration-tests job",
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
# Coverage floor (a ratchet): today's measured level, so a PR cannot lower it.
# Raise this in the PR that adds the tests which push it higher.
fail_under = 99
show_missing = true
