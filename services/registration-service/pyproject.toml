[project]
name = "registration-service"
version = "0.1.0"
description = "Attendee registration records (read-only for now; no registration/withdrawal logic)"
requires-python = ">=3.12"
dependencies = ["flask>=3.1.3", "psycopg2-binary>=2.9", "python-dotenv>=1.0.1"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
